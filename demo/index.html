<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a10" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- El grafo del modelo por defecto (VGG16). Adelantarlo ahorra un
         round-trip: TF.js pide model.json antes de los shards de pesos. -->
    <link rel="preload" as="fetch" href="./model/vgg16/model.json" />

    <!-- Content Security Policy se inyecta vía vite plugin (cspPlugin) según modo dev/prod -->
    <!-- Las tipografías (Inter / JetBrains Mono) se auto-hostean vía
         @fontsource y se importan en src/main.jsx. Sin third-party fetches. -->
    <!-- Frame-buster: evita que GitHub Pages (u otro hosting estático sin
         headers HTTP) sea embebido en un iframe malicioso. Va en un fichero
         aparte, no inline, para que lo cubra `script-src 'self'` sin
         depender de dónde se inyecte el meta de la CSP. -->
    <script src="./frame-guard.js"></script>

    <title>Detección de melanoma — VGG16 + TensorFlow.js</title>
    <meta
      name="description"
      content="Proyecto académico: sube una foto dermatoscópica y una VGG16 reentrenada la clasifica sola como benigna o maligna, en tu navegador. No es un dispositivo médico."
    />

    <!-- Open Graph. URLs absolutas (los crawlers no resuelven relativas). -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://abarriuso.github.io/melanoma-detection-vgg16/" />
    <meta property="og:title" content="Detección de melanoma" />
    <meta
      property="og:description"
      content="Proyecto académico: VGG16 reentrenada, análisis automático en el navegador con TensorFlow.js. No es un dispositivo médico."
    />
    <meta property="og:image" content="https://abarriuso.github.io/melanoma-detection-vgg16/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt"       content="Resumen del proyecto: AUC 0.9606, accuracy 88.8%, sensibilidad 87.8%." />
    <meta property="og:locale" content="es_ES" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Detección de melanoma" />
    <meta
      name="twitter:description"
      content="Proyecto académico: VGG16 reentrenada, análisis automático en el navegador con TensorFlow.js."
    />
    <meta name="twitter:image" content="https://abarriuso.github.io/melanoma-detection-vgg16/og.png" />

    <!-- JSON-LD para buscadores que entienden Schema.org. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Detección de melanoma",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Web Browser",
        "description": "Proyecto académico: sube una foto dermatoscópica y una VGG16 reentrenada (fine-tuning) la clasifica sola como benigna o maligna, con inferencia en el navegador vía TensorFlow.js. No es un dispositivo médico.",
        "url": "https://abarriuso.github.io/melanoma-detection-vgg16/",
        "image": "https://abarriuso.github.io/melanoma-detection-vgg16/og.png",
        "inLanguage": "es",
        "isAccessibleForFree": true,
        "author": {
          "@type": "Person",
          "name": "Adrián Barriuso Pizarro",
          "url": "https://github.com/abarriuso"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width:560px;margin:3rem auto;padding:1.5rem;color:#dddce6;background:#15151e;border:1px solid #1e1e2a;border-radius:10px;font-family:system-ui,sans-serif;text-align:center">
        <h2>JavaScript desactivado</h2>
        <p>El análisis de inteligencia artificial se ejecuta <strong>directamente en tu navegador</strong> mediante TensorFlow.js. Necesita JavaScript habilitado.</p>
        <p>Actívalo o consulta el código en
          <a style="color:#f0b654" href="https://github.com/abarriuso/melanoma-detection-vgg16">GitHub</a>.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
